name: Julia CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format (JuliaFormatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - name: Check formatting (check mode — never writes in CI)
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            for f in filter(isfile, Iterators.flatten((
                [joinpath("src", x) for x in readdir("src")],
                [joinpath("test", x) for x in readdir("test") if x != "cases"],
                [joinpath("test", "cases", x) for x in readdir(joinpath("test", "cases"))],
            )))
                text = read(f, String)
                formatted = JuliaFormatter.format_string(text)
                if text != formatted
                    @error "not formatted" file=f
                    exit(1)
                end
            end'

  jet:
    name: Static analysis (JET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: JET.test_package
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add("JET")
            using JET
            JET.test_package(path=".", julia_version="1")'

  test:
    name: Test (Test + Aqua)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.9", "1"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Pkg.test()
        run: julia --project=. -e 'using Pkg; Pkg.test()'
