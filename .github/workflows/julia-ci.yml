# symbolic refs here, pinned by .github/workflows/actions.lock (same dir).
# Refs resolved 2026-09-26:
#   actions/checkout@v7.0.1        = 3d3c42e5aac5ba805825da76410c181273ba90b1
#   julia-actions/setup-julia@v3.0.2 = fa02766e078afaaf09b14210362cee14137e6a32
#   julia-actions/cache@v2         = d10a6fd8f31b12404a54613ebad242900567f2b9

name: Julia CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format (JuliaFormatter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: "1"
      - name: Check formatting (check mode — never writes in CI)
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            for f in filter(f -> isfile(f) && endswith(f, ".jl"), collect(Iterators.flatten((
                [joinpath("src", x) for x in readdir("src")],
                [joinpath("test", x) for x in readdir("test") if x != "cases"],
                [joinpath("test", "cases", x) for x in readdir(joinpath("test", "cases"))],
            ))))
                text = read(f, String)
                formatted = JuliaFormatter.format_text(text)
                if text != formatted
                    @error "not formatted" file=f
                    exit(1)
                end
            end'

  jet:
    name: Static analysis (JET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      - name: JET.test_package
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.add("JET")
            using JET
            using CoprocessorRuntime
            JET.test_package(CoprocessorRuntime)'

  test:
    name: Test (Test + Aqua)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ["1.10", "1"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: julia-actions/setup-julia@v3.0.3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
      - name: Pkg.test()
        run: julia --project=. -e 'using Pkg; Pkg.test()'

  # ==========================================================================
  # Required status check "CI/gate" (Branch-Floor ruleset).
  # The check context is this job's name. It waits for every other job in this
  # workflow and runs even when one fails, is cancelled or is skipped; it exits
  # 0 only when every required job succeeded (or was skipped by design behind a
  # detector job that itself succeeded). Pattern: hyperpolymath/hypatia ci.yml.
  # ==========================================================================
  ci-gate:
    name: CI/gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [fmt, jet, test]
    if: always()
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: "fmt jet test"
          ADVISORY_JOBS: ""
          DESIGNED_SKIPS: ""
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          result_of() { local job="$1"; jq -r --arg j "$job" '.[$j].result // "missing"' <<< "$NEEDS_JSON"; }
          in_list() { local needle="$1" haystack="$2"; case " $haystack " in *" $needle "*) return 0 ;; esac; return 1; }
          detector_of() {
            local job="$1" pair
            for pair in $DESIGNED_SKIPS; do
              if [ "${pair%%:*}" = "$job" ]; then echo "${pair#*:}"; return 0; fi
            done
            return 1
          }
          row() { printf '| %s | %s | %s | %s |\n' "$@" | tee -a "$summary"; }
          {
            echo "### CI/gate"
            echo
            echo "| job | result | role | verdict |"
            echo "|---|---|---|---|"
          } | tee -a "$summary"
          fail=0
          total=0
          passed=0
          for j in $REQUIRED_JOBS; do
            total=$((total + 1))
            r=$(result_of "$j")
            case "$r" in
              success) v="ok"; passed=$((passed + 1)) ;;
              skipped)
                if d=$(detector_of "$j") && [ "$(result_of "$d")" = "success" ]; then
                  v="ok (designed skip; detector $d succeeded)"; passed=$((passed + 1))
                else
                  v="FAIL (skipped without a successful detector)"; fail=1
                fi ;;
              *) v="FAIL (result must be success)"; fail=1 ;;
            esac
            row "$j" "$r" required "$v"
          done
          for j in $ADVISORY_JOBS; do
            row "$j" "$(result_of "$j")" advisory "not gating"
          done
          for j in $(jq -r 'keys[]' <<< "$NEEDS_JSON"); do
            if ! in_list "$j" "$REQUIRED_JOBS $ADVISORY_JOBS"; then
              row "$j" "$(result_of "$j")" unclassified "FAIL (job is in needs but neither required nor advisory)"
              fail=1
            fi
          done
          if [ "$total" -eq 0 ]; then
            echo "::error::no required jobs configured"
            fail=1
          fi
          msg="required jobs: $total; satisfied: $passed; advisory: $(wc -w <<< "$ADVISORY_JOBS")"
          echo "$msg" | tee -a "$summary"
          if [ "$fail" -ne 0 ]; then
            echo "::error::CI/gate failed ($msg)"
            exit 1
          fi
          echo "CI/gate passed ($msg)"
