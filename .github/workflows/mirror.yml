# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Mirror to Git Forges
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read
jobs:
  mirror:
    uses: metadatastician/standards/.github/workflows/mirror-reusable.yml@8d1a2aab4211493cf42f147f2080f024605797dc
    # Explicit secrets map — no `secrets: inherit` (Hypatia WH008, alert #131).
    # All ten are the callee's complete optional contract (standards
    # mirror-reusable.yml@8d1a2aa); behaviour is unchanged, future secrets
    # are no longer shared implicitly.
    secrets:
      GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
      BITBUCKET_SSH_KEY: ${{ secrets.BITBUCKET_SSH_KEY }}
      CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
      SOURCEHUT_SSH_KEY: ${{ secrets.SOURCEHUT_SSH_KEY }}
      DISROOT_SSH_KEY: ${{ secrets.DISROOT_SSH_KEY }}
      GITEA_SSH_KEY: ${{ secrets.GITEA_SSH_KEY }}
      RADICLE_KEY: ${{ secrets.RADICLE_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_AGE_RECIPIENT: ${{ secrets.R2_AGE_RECIPIENT }}
