# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for CoprocessorRuntime.jl (julia-library archetype).
#
# Only ecosystems this repository has a manifest for. The template shipped
# cargo/mix/npm/pip entries; with no Cargo.toml, mix.exs, package.json or
# requirements.txt here, each weekly run failed ("pip in /.", "npm_and_yarn in /.",
# "hex in /."). Add an ecosystem back only together with its manifest.

version: 2
updates:
  # GitHub Actions - always include
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
    ignore:
      # HOLD: github/codeql-action at v4.38.0 (SHA-pinned). v4.38.1 fails
      # GitHub workflow-startup validation estate-wide (nexia-list#100;
      # SHA-form re-bump bypassed versions-scoped ignores - see
      # nexia-list#101/#104). Hold until upstream clears 4.38.1 or a
      # newer release verifies green; revisit deliberately.
      - dependency-name: "github/codeql-action"

  # Julia (Project.toml compat entries)
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dependency-updates:
        patterns: ["*"]

  # NOTE: Nix is banned estate-wide — Guix is the sole package manager.
  # Do not add a `nix` ecosystem here. Guix has no Dependabot ecosystem;
  # pin Guix channels/manifests via build/ tooling instead.
